version: '3'

vars:
  DIST_DIR: '{{.ROOT_DIR}}/dist'
  PYPI_TOKEN: '{{.PYPI_TOKEN | default ""}}'

tasks:
  version-check:
    desc: Fail if the current version already exists on PyPI
    vars:
      INIT_FILE: '{{.ROOT_DIR}}/zakuro_cache/__init__.py'
      PKG_NAME: zakuro_cache
    cmds:
      - |
        VERSION=$(grep -oP '__version__\s*=\s*"\K[^"]+' {{.INIT_FILE}})
        if [ -z "$VERSION" ]; then
          echo "ERROR: __version__ not found in {{.INIT_FILE}}"
          exit 1
        fi
        echo "Local version: $VERSION"
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/{{.PKG_NAME}}/json")
        if [ "$HTTP_CODE" = "404" ]; then
          echo "Package not yet on PyPI — skipping duplicate check."
          exit 0
        fi
        # Compare using PEP 440 normalization (via `packaging`), not raw string
        # equality: build backends (e.g. hatchling) normalize versions like
        # "0.0.1b" to "0.0.1b0" before publishing, so a naive string compare
        # can miss an already-published version and let a doomed upload
        # through, which PyPI then rejects with a 400.
        python3 -c "import packaging" 2>/dev/null || python3 -m pip install --quiet --disable-pip-version-check packaging
        ALREADY_PUBLISHED=$(curl -s "https://pypi.org/pypi/{{.PKG_NAME}}/json" | VERSION="$VERSION" python3 -c "
        import json, os, sys
        from packaging.version import Version, InvalidVersion

        data = json.load(sys.stdin)
        local = Version(os.environ['VERSION'])
        for raw in data.get('releases', {}):
            try:
                if Version(raw) == local:
                    print('yes')
                    sys.exit(0)
            except InvalidVersion:
                continue
        print('no')
        ")
        if [ "$ALREADY_PUBLISHED" = "yes" ]; then
          echo "ERROR: Version $VERSION (normalizes per PEP 440) already exists on PyPI. Bump the version before publishing."
          exit 1
        fi
        echo "Version $VERSION is not yet published — OK."

  check:
    desc: Verify distribution files before upload
    preconditions:
      - sh: command -v uv
        msg: "uv is required but not installed. Install with: curl -LsSf https://astral.sh/uv/install.sh | sh"
      - sh: ls {{.DIST_DIR}}/*.whl 2>/dev/null
        msg: "No wheel found in {{.DIST_DIR}}. Run 'task build:all' first."
    cmds:
      - uvx twine check {{.DIST_DIR}}/*.whl

  publish:
    desc: Build and publish package to PyPI
    silent: true
    preconditions:
      - sh: command -v uv
        msg: "uv is required but not installed. Install with: curl -LsSf https://astral.sh/uv/install.sh | sh"
      - sh: '[ -n "{{.PYPI_TOKEN}}" ]'
        msg: "PYPI_TOKEN is required. Usage: PYPI_TOKEN=pypi-xxx task deploy:publish"
    cmds:
      - task build:clean
      - task build:wheel
      - task deploy:check
      - uvx twine upload --username __token__ --password {{.PYPI_TOKEN}} {{.DIST_DIR}}/*.whl
